version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openall-in-ai
    ports:
      - "8000:8000"
    volumes:
      - ai-data:/app/data
      - ai-models:/app/models
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: PostgreSQL for production use
  # Remove if using SQLite (default)
  db:
    image: postgres:16-alpine
    container_name: openall-in-ai-db
    environment:
      - POSTGRES_USER=openall
      - POSTGRES_PASSWORD=${DB_PASSWORD:-openall_secret}
      - POSTGRES_DB=openall_in_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - with-postgres

volumes:
  ai-data:
  ai-models:
  postgres-data:

networks:
  default:
    name: openall-in-ai-network